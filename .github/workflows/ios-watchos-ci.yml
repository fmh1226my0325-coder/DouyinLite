
name: DouyinLite iOS and watchOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract v0.3 source
        run: |
          mkdir -p source
          unzip -q DouyinLite-v0.3-source.zip -d source
          PROJECT_FILE=$(find source -name project.yml -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "找不到 project.yml"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate
          xcodebuild -list

      - name: Build iOS Simulator
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -scheme DouyinLite \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DouyinLiteDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS Simulator
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -scheme DouyinLiteWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DouyinLiteDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-v0.3-build
          path: ${{ runner.temp }}/DouyinLiteDerived/Build/Products/
          if-no-files-found: error
          retention-days: 14
