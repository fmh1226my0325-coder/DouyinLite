
name: DouyinLite v0.4 iOS + watchOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "DouyinLite-v0.4-public-video-source.zip"
      - ".github/workflows/ios-watchos-ci.yml"

jobs:
  build:
    name: Build iOS and watchOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Extract v0.4 source
        run: |
          mkdir -p source
          unzip -q DouyinLite-v0.4-public-video-source.zip -d source

          PROJECT_FILE=$(find source -name project.yml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          echo "Found project: $PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Show Xcode schemes
        run: |
          cd "$PROJECT_DIR"
          xcodebuild -list -project DouyinLite.xcodeproj

      - name: Build iOS Simulator
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project DouyinLite.xcodeproj \
            -scheme DouyinLite \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS Simulator
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project DouyinLite.xcodeproj \
            -scheme DouyinLiteWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload v0.4 build products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-v0.4-build
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products
          if-no-files-found: error
          retention-days: 14
