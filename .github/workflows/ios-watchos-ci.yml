
name: DouyinLite v0.6 iOS + watchOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*v0.6*.zip"
      - ".github/workflows/ios-watchos-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS, watchOS and IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate and extract v0.6 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*v0.6*.zip' | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: v0.6 source ZIP not found in repository root."
            exit 1
          fi

          echo "Using source: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE="$(find source -name project.yml -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.yml not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate
          test -d DouyinLite.xcodeproj

      - name: Build iOS Simulator
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          xcodebuild \
            -project DouyinLite.xcodeproj \
            -scheme DouyinLite \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS Simulator
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          xcodebuild \
            -project DouyinLite.xcodeproj \
            -scheme DouyinLiteWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS app
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          xcodebuild \
            -project DouyinLite.xcodeproj \
            -scheme DouyinLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DouyinLite-v0.6.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify embedded Watch App
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DouyinLite-v0.6.xcarchive/Products/Applications/DouyinLite.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iOS app not found in archive."
            exit 1
          fi

          WATCH_PATH="$APP_PATH/Watch"

          if [ ! -d "$WATCH_PATH" ]; then
            echo "ERROR: Watch directory missing. Watch App is not embedded."
            exit 1
          fi

          WATCH_APP="$(find "$WATCH_PATH" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$WATCH_APP" ]; then
            echo "ERROR: Embedded Watch .app not found."
            exit 1
          fi

          echo "Watch App embedded successfully:"
          echo "$WATCH_APP"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/DouyinLite-v0.6.xcarchive/Products/Applications/DouyinLite.app"

          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/IPA/Payload/"

          cd "$RUNNER_TEMP/IPA"
          zip -qr "$RUNNER_TEMP/DouyinLite-v0.6-unsigned.ipa" Payload

          test -s "$RUNNER_TEMP/DouyinLite-v0.6-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-v0.6-unsigned-IPA
          path: ${{ runner.temp }}/DouyinLite-v0.6-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLite-v0.6-build-diagnostics
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products
            ${{ runner.temp }}/DouyinLite-v0.6.xcarchive/Info.plist
          if-no-files-found: warn
          retention-days: 14
