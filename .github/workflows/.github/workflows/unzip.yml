
name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o DouyinLite-v0.6-source.zip -d extracted
          cp -r extracted/DouyinLite-v0.6/. .
          rm -rf extracted
          rm -f DouyinLite-v0.6-source.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract DouyinLite source ZIP" || echo "No changes"
          git push
