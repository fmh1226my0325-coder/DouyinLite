name: DouyinLite
options:
  bundleIdPrefix: com.jionzyk
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.6"
    CURRENT_PROJECT_VERSION: "6"
targets:
  DouyinLite:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jionzyk.douyinlite
        PRODUCT_NAME: DouyinLite
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
    dependencies:
      # Embed the standalone Watch app inside the iOS app bundle.
      - target: DouyinLiteWatch
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
  DouyinLiteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jionzyk.douyinlite.watchkitapp
        PRODUCT_NAME: DouyinLiteWatch
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jionzyk.douyinlite
        # The Watch app fetches and plays independently; it does not rely on a live iPhone relay.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
